<!DOCTYPE html>
<html lang="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChronoDeck</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<style>
:root{
--day-bg:#f4f7ff;
--night-bg:#070b1c;
--panel-day:rgba(255,255,255,.85);
--panel-night:rgba(18,24,50,.85);
--txt-day:#070b1c;
--txt-night:#e6ebff;
--accent:#7b8cff;
--accent2:#00ffe0;
--blur:blur(28px)
}
.core{
width:14px;
height:14px;
border-radius:50%;
background:linear-gradient(135deg,var(--accent),var(--accent2));
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Space Grotesk",sans-serif}
html,body{width:100%;height:100%;overflow:hidden}
body{
    background:#000;
    color:var(--txt-day);
    position:relative;
}
#bg-video-container{
    position:fixed;
    inset:0;
    z-index:-2;
    overflow:hidden;
}
#bg-video{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    min-width:100%;
    min-height:100%;
    width:auto;
    height:auto;
    object-fit:cover;
}
#bg-overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.4);
    z-index:1;
}
body.night #bg-overlay{
    background:rgba(7,11,28,0.6);
}
#scene{position:fixed;inset:0;z-index:-1}
#app{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
perspective:1600px;
position:relative;
z-index:2;
}
.panel{
width:min(92vw,560px);
height:92vh;
max-height:760px;
background:var(--panel-day);
backdrop-filter:var(--blur);
border-radius:36px;
padding:32px;
display:flex;
flex-direction:column;
justify-content:space-between;
box-shadow:0 60px 140px rgba(0,0,0,.35);
transform-style:preserve-3d;
animation:float 10s ease-in-out infinite;
transition:.8s;
border:1px solid rgba(255,255,255,0.1);
}
body.night .panel{
    background:var(--panel-night);
    box-shadow:0 60px 140px rgba(0,0,0,.6);
}
@keyframes float{
0%{transform:rotateX(0) rotateY(0) translateY(0)}
50%{transform:rotateX(8deg) rotateY(-8deg) translateY(-14px)}
100%{transform:rotateX(0) rotateY(0) translateY(0)}
}
.header{
display:flex;
justify-content:space-between;
align-items:center
}
.brand{
display:flex;
align-items:center;
gap:12px;
font-weight:700;
letter-spacing:1px;
color:#ffffff;
text-shadow:0 2px 10px rgba(0,0,0,0.2);
}
.core{
width:14px;
height:14px;
border-radius:50%;
background:linear-gradient(135deg,var(--accent),var(--accent2));
box-shadow:0 0 24px var(--accent)
}
.clock{
text-align:center;
margin-top:18px
}
.time{
font-size:64px;
font-weight:700;
letter-spacing:4px;
text-shadow:0 2px 20px rgba(0,0,0,0.3);
color:#ffffff;
}
.date{
margin-top:8px;
opacity:.85;
font-size:14px;
text-shadow:0 1px 5px rgba(0,0,0,0.2);
color:#ffffff;
}
.player{
margin-top:28px;
display:flex;
flex-direction:column;
gap:18px
}
.upload{
position:relative;
padding:14px;
border-radius:16px;
background:rgba(0,0,0,.1);
text-align:center;
font-size:13px;
cursor:pointer;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
transition:all 0.3s ease;
color:#ffffff;
}
.upload:hover{
    background:rgba(0,0,0,.15);
    transform:translateY(-2px);
}
body.night .upload{
    background:rgba(255,255,255,.05);
    color:var(--txt-night);
}
.upload input{
position:absolute;
inset:0;
opacity:0;
cursor:pointer
}
.controls{
display:flex;
justify-content:center;
gap:20px
}
.btn{
width:56px;
height:56px;
border-radius:18px;
background:linear-gradient(145deg,var(--accent),var(--accent2));
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 25px 50px rgba(0,0,0,.4);
cursor:pointer;
transition:.2s;
border:none;
}
.btn:hover{
    transform:scale(1.05);
    box-shadow:0 30px 60px rgba(0,0,0,.5);
}
.btn:active{transform:scale(.92)}
.btn img{width:22px;height:22px;filter:brightness(0) invert(1);}
.visualizer{
display:flex;
align-items:flex-end;
height:100px;
gap:4px;
background:rgba(0,0,0,0.1);
border-radius:12px;
padding:20px;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.05);
}
.bar{
flex:1;
height:12%;
border-radius:6px 6px 0 0;
background:linear-gradient(180deg,var(--accent2),var(--accent));
transition:height .08s;
box-shadow:0 0 10px rgba(123,140,255,0.3);
}
.footer{
text-align:center;
font-size:11px;
opacity:.7;
text-shadow:0 1px 3px rgba(0,0,0,0.3);
color:#ffffff;
}
@media(max-width:600px){
.time{font-size:48px}
.panel{padding:24px}
.visualizer{padding:15px;}
}
</style>
</head>

<body>
<div id="bg-video-container">
    <video id="bg-video" autoplay muted loop playsinline poster="https://img1.wsimg.com/isteam/videos/uA41GmyyG8IMaxXdb">
        <source src="https://websites.godaddy.com/categories/v4/videos/raw/video/uA41GmyyG8IMaxXdb" type="video/mp4">
    </video>
    <div id="bg-overlay"></div>
</div>

<canvas id="scene"></canvas>

<div id="app">
<div class="panel">
<div>
<div class="header">
<div class="brand"><div class="core"></div>ChronoDeck</div>
</div>

<div class="clock">
<div class="time" id="time">00:00:00</div>
<div class="date" id="date"></div>
</div>

<div class="player">
<div class="upload">
Upload Music
<input type="file" id="files" accept="audio/*" multiple>
</div>

<div class="controls">
<button class="btn" id="prev">
<img src="arrow.png" alt="prev">
</button>
<button class="btn" id="play">
<img id="playIcon" src="play-button.png" alt="play">
</button>
<button class="btn" id="next">
<img src="next.png" alt="next">
</button>
</div>

<div class="visualizer" id="viz"></div>
</div>
</div>

<div class="footer">&copy; 2026 Powered By Neverlabs</div>
</div>
</div>

<script>
const timeEl=document.getElementById("time")
const dateEl=document.getElementById("date")
const filesInput=document.getElementById("files")
const playBtn=document.getElementById("play")
const playIcon=document.getElementById("playIcon")
const nextBtn=document.getElementById("next")
const prevBtn=document.getElementById("prev")
const vizEl=document.getElementById("viz")
const bgVideo=document.getElementById("bg-video")
const bgOverlay=document.getElementById("bg-overlay")

let audio=new Audio()
let audioCtx,source,analyser
let trackList=[]
let currentIndex=0
let isPlaying=false

const playIconUrl="https://cdn-icons-png.flaticon.com/512/727/727245.png"
const pauseIconUrl="pause.png"

for(let i=0;i<40;i++){
let bar=document.createElement("div")
bar.className="bar"
vizEl.appendChild(bar)
}

function updateTime(){
let now=new Date()
let hours=now.getHours()
timeEl.textContent=
String(hours).padStart(2,"0")+":"+
String(now.getMinutes()).padStart(2,"0")+":"+
String(now.getSeconds()).padStart(2,"0")

dateEl.textContent=new Intl.DateTimeFormat(
navigator.language,
{weekday:"long",year:"numeric",month:"long",day:"numeric"}
).format(now)

const isNight=hours>=18||hours<6
document.body.classList.toggle("night",isNight)

if(isNight){
    bgVideo.style.filter="brightness(0.7) contrast(1.1)"
}else{
    bgVideo.style.filter="brightness(1) contrast(1)"
}
}
setInterval(updateTime,1000)
updateTime()

function saveTracksToStorage(){
const trackNames=trackList.map(f=>f.name)
localStorage.setItem("chronodeck_tracks",JSON.stringify(trackNames))
localStorage.setItem("chronodeck_current_index",currentIndex.toString())
}

function loadTracksFromStorage(){
const savedNames=JSON.parse(localStorage.getItem("chronodeck_tracks")||"[]")
if(savedNames.length>0){
trackList=savedNames.map(name=>new File([],name,{type:"audio/*"}))
currentIndex=parseInt(localStorage.getItem("chronodeck_current_index")||"0")
if(trackList.length>0){
loadCurrentTrack()
}
}
}

filesInput.onchange=e=>{
const files=Array.from(e.target.files)
if(files.length>0){
trackList=files
currentIndex=0
saveTracksToStorage()
loadCurrentTrack()
}
}

function loadCurrentTrack(){
if(trackList.length===0)return
const file=trackList[currentIndex]
audio.src=URL.createObjectURL(file)
audio.load()
if(isPlaying){
audio.play()
playIcon.src=pauseIconUrl
}
}

function playPause(){
if(!audioCtx){
audioCtx=new AudioContext()
source=audioCtx.createMediaElementSource(audio)
analyser=audioCtx.createAnalyser()
source.connect(analyser)
analyser.connect(audioCtx.destination)
analyser.fftSize=128
}
if(audio.paused){
audio.play()
isPlaying=true
playIcon.src=pauseIconUrl
}else{
audio.pause()
isPlaying=false
playIcon.src=playIconUrl
}
}

playBtn.onclick=playPause

nextBtn.onclick=()=>{
if(trackList.length===0)return
currentIndex=(currentIndex+1)%trackList.length
saveTracksToStorage()
loadCurrentTrack()
}

prevBtn.onclick=()=>{
if(trackList.length===0)return
currentIndex=(currentIndex-1+trackList.length)%trackList.length
saveTracksToStorage()
loadCurrentTrack()
}

audio.onended=()=>{
if(trackList.length>1){
currentIndex=(currentIndex+1)%trackList.length
saveTracksToStorage()
loadCurrentTrack()
}else{
isPlaying=false
playIcon.src=playIconUrl
}
}

function animateVisualizer(){
requestAnimationFrame(animateVisualizer)
if(!analyser)return
let data=new Uint8Array(analyser.frequencyBinCount)
analyser.getByteFrequencyData(data)
document.querySelectorAll(".bar").forEach((bar,i)=>{
bar.style.height=(data[i]/255*100)+"%"
})
}
animateVisualizer()

const canvas=document.getElementById("scene")
const renderer=new THREE.WebGLRenderer({canvas,alpha:true})
renderer.setSize(innerWidth,innerHeight)
const scene=new THREE.Scene()
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000)
camera.position.z=6
const geometry=new THREE.IcosahedronGeometry(1.8,1)
const material=new THREE.MeshStandardMaterial({color:0x7b8cff,metalness:.6,roughness:.2,transparent:true,opacity:0.8})
const mesh=new THREE.Mesh(geometry,material)
scene.add(mesh)
const pointLight=new THREE.PointLight(0x00ffe0,1.5)
pointLight.position.set(4,4,4)
scene.add(pointLight)
const ambientLight=new THREE.AmbientLight(0xffffff,.4)
scene.add(ambientLight)

function animate3D(){
requestAnimationFrame(animate3D)
mesh.rotation.x+=.003
mesh.rotation.y+=.004
renderer.render(scene,camera)
}
animate3D()

addEventListener("resize",()=>{
renderer.setSize(innerWidth,innerHeight)
camera.aspect=innerWidth/innerHeight
camera.updateProjectionMatrix()
bgVideo.style.width='auto'
bgVideo.style.height='auto'
})

bgVideo.addEventListener('loadeddata',function(){
console.log('Background video loaded')
})

bgVideo.addEventListener('error',function(){
console.log('Video failed to load, using static image')
document.getElementById('bg-video-container').style.backgroundImage='url(https://img1.wsimg.com/isteam/videos/uA41GmyyG8IMaxXdb)'
document.getElementById('bg-video-container').style.backgroundSize='cover'
document.getElementById('bg-video-container').style.backgroundPosition='center'
bgVideo.style.display='none'
})

loadTracksFromStorage()
</script>
</body>
</html>
