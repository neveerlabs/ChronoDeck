<!DOCTYPE html>
<html lang="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChronoDeck</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<style>
:root{
--day-bg:#f4f7ff;
--night-bg:#070b1c;
--panel-day:rgba(255,255,255,.75);
--panel-night:rgba(18,24,50,.75);
--txt-day:#070b1c;
--txt-night:#e6ebff;
--accent:#7b8cff;
--accent2:#00ffe0;
--blur:blur(28px)
}
.core{
width:14px;
height:14px;
border-radius:50%;
background:linear-gradient(135deg,var(--accent),var(--accent2));
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Space Grotesk",sans-serif}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--day-bg);color:var(--txt-day);transition:.8s}
body.night{background:var(--night-bg);color:var(--txt-night)}
#scene{position:fixed;inset:0;z-index:-1}
#app{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
perspective:1600px
}
.panel{
width:min(92vw,560px);
height:92vh;
max-height:760px;
background:var(--panel-day);
backdrop-filter:var(--blur);
border-radius:36px;
padding:32px;
display:flex;
flex-direction:column;
justify-content:space-between;
box-shadow:0 60px 140px rgba(0,0,0,.35);
transform-style:preserve-3d;
animation:float 10s ease-in-out infinite;
transition:.8s
}
body.night .panel{background:var(--panel-night)}
@keyframes float{
0%{transform:rotateX(0) rotateY(0) translateY(0)}
50%{transform:rotateX(8deg) rotateY(-8deg) translateY(-14px)}
100%{transform:rotateX(0) rotateY(0) translateY(0)}
}
.header{
display:flex;
justify-content:space-between;
align-items:center
}
.brand{
display:flex;
align-items:center;
gap:12px;
font-weight:700;
letter-spacing:1px
}
.core{
width:14px;
height:14px;
border-radius:50%;
background:linear-gradient(135deg,var(--accent),var(--accent2));
box-shadow:0 0 24px var(--accent)
}
.clock{
text-align:center;
margin-top:18px
}
.time{
font-size:64px;
font-weight:700;
letter-spacing:4px
}
.date{
margin-top:8px;
opacity:.85;
font-size:14px
}
.player{
margin-top:28px;
display:flex;
flex-direction:column;
gap:18px
}
.upload{
position:relative;
padding:14px;
border-radius:16px;
background:rgba(0,0,0,.08);
text-align:center;
font-size:13px;
cursor:pointer
}
body.night .upload{background:rgba(255,255,255,.08)}
.upload input{
position:absolute;
inset:0;
opacity:0;
cursor:pointer
}
.controls{
display:flex;
justify-content:center;
gap:20px
}
.btn{
width:56px;
height:56px;
border-radius:18px;
background:linear-gradient(145deg,var(--accent),var(--accent2));
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 25px 50px rgba(0,0,0,.4);
cursor:pointer;
transition:.2s
}
.btn:active{transform:scale(.92)}
.btn svg{width:22px;height:22px;fill:white}
.visualizer{
display:flex;
align-items:flex-end;
height:100px;
gap:4px
}
.bar{
flex:1;
height:12%;
border-radius:6px 6px 0 0;
background:linear-gradient(180deg,var(--accent2),var(--accent));
transition:height .08s
}
.footer{
text-align:center;
font-size:11px;
opacity:.5
}
@media(max-width:600px){
.time{font-size:48px}
.panel{padding:24px}
}
</style>
</head>

<body>
<canvas id="scene"></canvas>

<div id="app">
<div class="panel">
<div>
<div class="header">
<div class="brand"><div class="core"></div>ChronoDeck</div>
</div>

<div class="clock">
<div class="time" id="time">00:00:00</div>
<div class="date" id="date"></div>
</div>

<div class="player">
<div class="upload">
Upload Music
<input type="file" id="files" accept="audio/*" multiple>
</div>

<div class="controls">
<div class="btn" id="prev">
<svg viewBox="0 0 24 24"><path d="M6 19V5h2v14H6zm3.5-7L18 5v14l-8.5-7z"/></svg>
</div>
<div class="btn" id="play">
<svg id="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
</div>
<div class="btn" id="next">
<svg viewBox="0 0 24 24"><path d="M16 5v14h2V5h-2zM6 19l8.5-7L6 5v14z"/></svg>
</div>
</div>

<div class="visualizer" id="viz"></div>
</div>
</div>

<div class="footer">&copy; 2026 Powered By Neverlabs</div>
</div>
</div>

<script>
const t=document.getElementById("time")
const d=document.getElementById("date")
const files=document.getElementById("files")
const play=document.getElementById("play")
const icon=document.getElementById("icon")
const next=document.getElementById("next")
const prev=document.getElementById("prev")
const viz=document.getElementById("viz")

let audio=new Audio()
let ctx,src,analyser
let list=[]
let idx=0
let playing=false

for(let i=0;i<40;i++){
let b=document.createElement("div")
b.className="bar"
viz.appendChild(b)
}

function updateTime(){
let n=new Date()
let h=n.getHours()
t.textContent=
String(h).padStart(2,"0")+":"+
String(n.getMinutes()).padStart(2,"0")+":"+
String(n.getSeconds()).padStart(2,"0")

d.textContent=new Intl.DateTimeFormat(
navigator.language,
{weekday:"long",year:"numeric",month:"long",day:"numeric"}
).format(n)

document.body.classList.toggle("night",h>=18||h<6)
}
setInterval(updateTime,1000)
updateTime()

files.onchange=e=>{
list=[...e.target.files]
localStorage.setItem("tracks",JSON.stringify(list.map(f=>f.name)))
idx=0
load()
}

function load(){
if(!list.length)return
audio.src=URL.createObjectURL(list[idx])
audio.load()
if(playing)audio.play()
}

play.onclick=()=>{
if(!ctx){
ctx=new AudioContext()
src=ctx.createMediaElementSource(audio)
analyser=ctx.createAnalyser()
src.connect(analyser)
analyser.connect(ctx.destination)
analyser.fftSize=128
}
if(audio.paused){
audio.play()
playing=true
icon.setAttribute("d","M6 5h4v14H6zm8 0h4v14h-4z")
}else{
audio.pause()
playing=false
icon.setAttribute("d","M8 5v14l11-7z")
}
}

next.onclick=()=>{
if(!list.length)return
idx=(idx+1)%list.length
load()
}

prev.onclick=()=>{
if(!list.length)return
idx=(idx-1+list.length)%list.length
load()
}

audio.onended=()=>{
if(list.length>1){
let n=idx
while(n===idx)n=Math.floor(Math.random()*list.length)
idx=n
}else idx=0
load()
}

function animateViz(){
requestAnimationFrame(animateViz)
if(!analyser)return
let data=new Uint8Array(analyser.frequencyBinCount)
analyser.getByteFrequencyData(data)
document.querySelectorAll(".bar").forEach((b,i)=>{
b.style.height=(data[i]/255*100)+"%"
})
}
animateViz()

const canvas=document.getElementById("scene")
const renderer=new THREE.WebGLRenderer({canvas,alpha:true})
renderer.setSize(innerWidth,innerHeight)
const scene=new THREE.Scene()
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000)
camera.position.z=6
const geo=new THREE.IcosahedronGeometry(1.8,1)
const mat=new THREE.MeshStandardMaterial({color:0x7b8cff,metalness:.6,roughness:.2})
const mesh=new THREE.Mesh(geo,mat)
scene.add(mesh)
const light1=new THREE.PointLight(0x00ffe0,1)
light1.position.set(4,4,4)
scene.add(light1)
const light2=new THREE.AmbientLight(0xffffff,.4)
scene.add(light2)

function animate3D(){
requestAnimationFrame(animate3D)
mesh.rotation.x+=.003
mesh.rotation.y+=.004
renderer.render(scene,camera)
}
animate3D()

addEventListener("resize",()=>{
renderer.setSize(innerWidth,innerHeight)
camera.aspect=innerWidth/innerHeight
camera.updateProjectionMatrix()
})
</script>
</body>
</html>
